<title>6 Central Command Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a pixel-art station deck on the left, a command console on the right, HUD across the top, refit toolbar under the deck. One committed dark look (a ship at night). */
:root{
  --void:#070a12; --hull:#0d1322; --panel:#121a2c; --panel2:#18223a; --line:#2a3757;
  --text:#dfe7f6; --dim:#8794b3; --amber:#ffb547; --cyan:#57d3ff; --good:#62e394; --bad:#ff6170; --violet:#ae94ff;
  --f-display:'Silkscreen','Courier New',monospace;
  --f-term:'VT323','Courier New',monospace;
  --f-body:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--text);font-family:var(--f-body);font-size:13px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{display:flex;flex-direction:column;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border:2px solid var(--line);background:var(--hull);padding:8px 12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--amber);display:flex;align-items:center;gap:8px}
.brand small{font-weight:400;color:var(--dim);font-size:10px;letter-spacing:.1em}
.chip{font-family:var(--f-display);font-size:10px;letter-spacing:.08em;padding:3px 8px;border:1px solid var(--line);background:var(--panel);color:var(--dim);white-space:nowrap}
.chip b{color:var(--text);font-weight:700}
.chip.live b{color:var(--good)}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.xpbar{width:90px;height:6px;background:var(--panel2);border:1px solid var(--line);display:inline-block;vertical-align:middle;margin-left:6px}
.xpbar i{display:block;height:100%;background:var(--amber)}
.hud .sp{flex:1}
.btn{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;padding:6px 10px;border:2px solid var(--line);background:var(--panel2);color:var(--text)}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:var(--amber);color:#1b1206;border-color:var(--amber)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.on{border-color:var(--good);color:var(--good)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{font-size:9px;padding:3px 7px;border-width:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.deck{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:12px;flex:1;min-height:0}
@media (max-width:980px){.deck{grid-template-columns:minmax(0,1fr)}}
.stage{border:2px solid var(--line);background:var(--hull);display:flex;flex-direction:column;min-width:0}
.stagebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:2px solid var(--line);font-family:var(--f-display);font-size:10px;color:var(--dim)}
.stagebar .sp{flex:1}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair;touch-action:manipulation}
#refit{border-top:2px solid var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel)}
#refit .tool{font-family:var(--f-display);font-size:10px;padding:5px 8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
#refit .tool.sel{border-color:var(--amber);color:var(--amber)}
#refit .tool kbd{color:var(--cyan);margin-right:4px;font-family:var(--f-display)}
#refitsub{display:flex;flex-wrap:wrap;gap:6px;width:100%}
#hint{padding:6px 10px;font-family:var(--f-term);font-size:18px;color:var(--cyan);min-height:30px;border-top:1px dashed var(--line)}
.console{border:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:560px;max-height:calc(100vh - 110px)}
@media (max-width:980px){.console{max-height:none}}
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{flex:1 1 auto;font-family:var(--f-display);font-size:10px;letter-spacing:.06em;padding:8px 6px;background:transparent;border:0;border-right:1px solid var(--line);color:var(--dim)}
.tabs button.sel{background:var(--panel2);color:var(--amber)}
.tabs button .dot{display:inline-block;width:6px;height:6px;background:var(--bad);margin-left:4px;vertical-align:middle}
#panel{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
h2{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;color:var(--amber);margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;color:var(--cyan);margin:0}
.muted{color:var(--dim)}
.small{font-size:11px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.live{border-color:var(--good)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11px}
.kv dt{color:var(--dim);font-family:var(--f-display);font-size:9px;letter-spacing:.08em;padding-top:2px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],input[type=time],select,textarea{background:var(--void);border:1px solid var(--line);padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:3px;font-family:var(--f-display);font-size:9px;letter-spacing:.08em;color:var(--dim)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line)}
.seg button{flex:1;font-family:var(--f-display);font-size:9px;padding:6px 4px;background:transparent;border:0;border-right:1px solid var(--line);color:var(--dim)}
.seg button:last-child{border-right:0}
.seg button.sel{background:var(--amber);color:#1b1206}
.meter{display:grid;grid-template-columns:80px 1fr 34px;gap:6px;align-items:center;font-family:var(--f-display);font-size:8px;color:var(--dim)}
.meter span.bar{height:5px;background:var(--void);border:1px solid var(--line)}
.meter span.bar i{display:block;height:100%}
/* comms */
.agentpick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.agentpick button{flex:0 0 auto;font-family:var(--f-display);font-size:9px;padding:4px 8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
.agentpick button.sel{border-color:var(--amber);color:var(--amber)}
.agentpick button .lit{display:inline-block;width:6px;height:6px;background:var(--good);margin-right:4px}
#log{display:flex;flex-direction:column;gap:8px;flex:1;overflow:auto;min-height:220px}
.msg{border-left:3px solid var(--line);padding:6px 10px;background:var(--panel2);min-width:0;overflow-wrap:anywhere}
.msg .who{font-family:var(--f-display);font-size:9px;letter-spacing:.08em;color:var(--dim);display:flex;gap:8px;align-items:center}
.msg.you{border-color:var(--amber);background:transparent}
.msg.agent{border-color:var(--cyan)}
.msg.system{border-color:var(--violet);background:transparent;color:var(--dim);font-size:12px}
.msg.ask{border-color:var(--amber);background:#2a1f0c}
.msg .body{white-space:pre-wrap}
.msg .body code{background:var(--void);padding:0 3px}
.msg .body pre{background:var(--void);padding:6px;overflow-x:auto;white-space:pre}
.msg img{background:#fff;max-width:220px;border:1px solid var(--line)}
.typing{font-family:var(--f-term);font-size:18px;color:var(--good)}
.composer{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line);padding-top:8px}
.composer textarea{min-height:52px}
.verdicts button{font-family:var(--f-display);font-size:10px}
.v-up{border-color:var(--good)!important;color:var(--good)!important}
.v-mid{border-color:var(--amber)!important;color:var(--amber)!important}
.v-dn{border-color:var(--bad)!important;color:var(--bad)!important}
/* quests */
.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tree li{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start;font-size:12px}
.mark{font-family:var(--f-display);font-size:9px;letter-spacing:.06em;padding-top:2px}
.mark.done{color:var(--good)} .mark.here{color:var(--amber)} .mark.run{color:var(--cyan)} .mark.next{color:var(--dim)}
.evidence{font-size:11px;color:var(--dim);border-left:2px solid var(--good);padding-left:8px;margin-top:4px;white-space:pre-wrap}
.belief{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start;font-size:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.belief.struck .t{text-decoration:line-through;color:var(--dim)}
.belief .src{font-size:10px;color:var(--dim)}
.tag{font-family:var(--f-display);font-size:8px;letter-spacing:.06em;padding:1px 5px;border:1px solid var(--line);color:var(--dim)}
.tag.ok{border-color:var(--good);color:var(--good)} .tag.bad{border-color:var(--bad);color:var(--bad)} .tag.amb{border-color:var(--amber);color:var(--amber)}
table.t{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-display);font-size:8px;letter-spacing:.06em;color:var(--dim);text-align:left;border-bottom:1px solid var(--line);padding:4px}
table.t td{border-bottom:1px dashed var(--line);padding:4px;vertical-align:top}
.tw{overflow-x:auto}
/* modal */
#modal{position:fixed;inset:0;background:rgba(3,5,10,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
#modal .box{background:var(--panel);border:2px solid var(--amber);max-width:760px;width:100%;max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.classgrid button{text-align:left;border:1px solid var(--line);background:var(--panel2);padding:8px;display:flex;flex-direction:column;gap:4px}
.classgrid button:hover,.classgrid button.sel{border-color:var(--amber)}
.classgrid .cn{font-family:var(--f-display);font-size:11px}
.classgrid .cb{font-size:11px;color:var(--dim)}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:60;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--panel2);border:2px solid var(--cyan);padding:8px 10px;font-family:var(--f-term);font-size:18px;line-height:1.1}
.toast.xp{border-color:var(--amber);color:var(--amber)}
.toast.bad{border-color:var(--bad)}
.banner{border:1px dashed var(--amber);color:var(--amber);padding:8px;font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="hud">
    <div class="brand"><span aria-hidden="true">◈</span> 6C COMMAND DECK <small>6 CENTRAL ENTERPRISES</small></div>
    <span class="chip" id="hudLevel" title="Station level rolls up every agent's XP. It unlocks and gates nothing.">STATION LV <b>1</b></span>
    <span class="chip live" id="hudLive" title="Counts only model calls in flight right now.">LIVE RUNS <b>0</b></span>
    <span class="chip" id="hudAuto">AUTONOMY <b>SUGGEST</b></span>
    <span class="chip" id="hudLink">CLAUDE LINK <b>…</b></span>
    <span class="sp"></span>
    <button class="btn" id="btnVoice" title="Read agent answers aloud">🔈 VOICE OFF</button>
    <button class="btn" id="btnRecruit">＋ RECRUIT</button>
    <button class="btn pri" id="btnRefit">⚒ REFIT STATION</button>
  </header>
  <main class="deck">
    <section class="stage" aria-label="Station floor">
      <div class="stagebar"><span id="stageTitle">STATION FLOOR</span><span class="sp"></span><span id="stageLegend">LIT BELT = READY · DARK BELT = SOMETHING MISSING · LIT DESK = LIVE WORKER</span></div>
      <canvas id="cv" width="1664" height="960"></canvas>
      <div id="refit" hidden>
        <div class="row" id="refittools"></div>
        <div id="refitsub"></div>
      </div>
      <div id="hint">Click a desk to staff it. Click the INBOX to send work down a line.</div>
    </section>
    <aside class="console">
      <nav class="tabs" id="tabs"></nav>
      <div id="panel"></div>
    </aside>
  </main>
</div>
<div id="modal" hidden><div class="box" id="modalbox"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   CONSTANTS
   ============================================================ */
const COLS=26, ROWS=15, T=32, QUARTERS=3;           // grid; first 3 columns are crew quarters
const AWAY_MS=30*60e3, COOLDOWN_MS=45*60e3;         // autonomy timing
const PACE={LIGHT:1,STANDARD:3,BUSY:6,MAX:12};
const XP_PER_NAIL=25;
const lvlFor=xp=>{let n=1;while(25*(n+1)*n<=xp)n++;return n};      // 50,150,300,500…2250
const xpFor=n=>25*n*(n-1);
const TIERS={quick:'SWIFT',default:'STANDARD',complex:'DEEP'};

const CLASSES={
  overseer:{label:'OVERSEER',color:'#ffb547',tier:'complex',delegate:true,loadout:['core','cab'],blurb:'Runs the station, recruits crew and delegates work. Cannot be dismissed.'},
  allocator:{label:'ALLOCATOR',color:'#9be3c2',tier:'complex',delegate:true,loadout:['core','cab'],blurb:'Portfolio fit, priorities and keep / later / kill calls across 6C projects.'},
  researcher:{label:'RESEARCHER',color:'#57d3ff',tier:'default',loadout:['dish','cab','core'],blurb:'Digs, compares, and flags anything it cannot verify.'},
  builder:{label:'BUILDER',color:'#62e394',tier:'complex',loadout:['bench','cab'],blurb:'Writes and tests code at the workbench.'},
  marketer:{label:'MARKETER',color:'#ff86cf',tier:'default',loadout:['studio','cab'],blurb:'Offers, local SEO, content and campaigns. Honest claims only.'},
  analyst:{label:'ANALYST',color:'#ae94ff',tier:'default',loadout:['bench','cab'],blurb:'Unit economics, pricing math and validation tests.'},
  writer:{label:'WRITER',color:'#f2e16b',tier:'quick',loadout:['cab','core'],blurb:'Emails, scripts, SOPs and page copy.'},
  dispatcher:{label:'DISPATCHER',color:'#ff9a4f',tier:'quick',loadout:['cab','core'],blurb:'Roadside and home-service ops: intake, routing, follow-ups.'},
  custom:{label:'CUSTOM',color:'#c9d3e6',tier:'default',loadout:['cab'],blurb:'Your own specialty. Describe it in the interview.'}
};
const GEAR={
  console:{label:'CONSOLE',grants:'COMPUTE',desc:'A PC for the desk beside it. A desk with no PC next to it cannot run.'},
  cab:{label:'INTEL CAB',grants:'FILES',desc:'Read and write files in the station workshop.'},
  core:{label:'CORE',grants:'MEMORY',desc:'Agents remember things between jobs.'},
  bench:{label:'WORKBENCH',grants:'TERMINAL',desc:'Runs real JavaScript in a sandbox. Asks your approval first.'},
  studio:{label:'STUDIO',grants:'IMAGES',desc:'Makes SVG images and saves them to the workshop.'},
  dish:{label:'DISH',grants:'WEB',desc:'Web search. Not wired in this browser build yet, so it stays dormant and agents say so.'}
};
const SIGNS={
  filter:{label:'FILTER',desc:'Sorts each job by its text into CODE, RESEARCH or EVERYTHING ELSE. Free: sorting runs on the station, not the model.'},
  splitter:{label:'SPLITTER',desc:'Deals jobs across its lanes. With a JOINER downstream it sends a copy down every lane at once.'},
  joiner:{label:'JOINER',desc:'Waits for every branch, then sends one merged result on.'},
  merger:{label:'MERGER',desc:'Folds several belts into one without changing the jobs.'},
  loop:{label:'LOOP',desc:'Draft, critique, redraft. Sends work BACK until the reviewer starts with APPROVED or the pass limit hits, then out the DONE lane.'}
};
const DIMS=['identity','mission','goals','priorities','values','style','customers','portfolio','constraints'];
const SKINS=[['#f1c7a3','#3a2416'],['#c98d63','#1d120b'],['#8d5a3b','#0f0a07'],['#5b3a26','#0b0806'],['#e8b98f','#a1462b'],['#d9a47c','#d7d0c4']];

/* ============================================================
   UTILS
   ============================================================ */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ago=t=>{if(!t)return '—';const s=(Date.now()-t)/1e3;if(s<60)return Math.round(s)+'s ago';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago'};
const hhmm=t=>t?new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'—';
const today=()=>new Date().toISOString().slice(0,10);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function md(s){
  let h=esc(s);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\w*\n/,'')+'</pre>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/^#{1,4} (.*)$/gm,'<b>$1</b>');
  return h;
}
function toast(text,cls=''){
  const d=document.createElement('div');d.className='toast '+cls;d.textContent=text;$('#toasts').append(d);
  setTimeout(()=>d.remove(),4200);
}

/* ============================================================
   STATE
   ============================================================ */
function seed(){
  const ov={id:'a_ov',name:'CENTRAL',cls:'overseer',tier:'complex',skin:0,personality:'Calm, direct, protective of your time',interview:[],memory:[],xp:0,runs:0,clean:0,ratings:[],created:Date.now(),overseer:true};
  const rs={id:'a_rs',name:'SCOUT',cls:'researcher',tier:'default',skin:2,personality:'Curious and skeptical',interview:[],memory:[],xp:0,runs:0,clean:0,ratings:[],created:Date.now()};
  const wr={id:'a_wr',name:'QUILL',cls:'writer',tier:'quick',skin:4,personality:'Warm and plain-spoken',interview:[],memory:[],xp:0,runs:0,clean:0,ratings:[],created:Date.now()};
  const it=(type,x,y,extra={})=>({id:'i_'+uid(),type,x,y,...extra});
  const inbox=it('inbox',6,4,{hopCap:6}), b1=it('bay',10,4,{agentId:'a_rs'}), b2=it('bay',14,4,{agentId:'a_wr'}), out=it('outbox',18,4);
  const bO=it('bay',6,10,{agentId:'a_ov'});
  const items=[inbox,b1,b2,out,bO,
    it('console',10,3),it('console',14,3),it('console',6,11),
    it('cab',21,9),it('core',23,9),it('bench',21,12),it('studio',23,12),it('dish',23,2)];
  const belts=[{id:'b_'+uid(),from:inbox.id,to:b1.id},{id:'b_'+uid(),from:b1.id,to:b2.id},{id:'b_'+uid(),from:b2.id,to:out.id}];
  const B=(dim,text)=>({id:'k_'+uid(),dim,text,source:'Seeded from your 6C profile',status:'kept',t:Date.now()});
  return {
    v:1,savedAt:0,
    agents:[ov,rs,wr],items,belts,
    beliefs:[
      B('identity','The Commander is Terell John, founder of 6 Central Enterprises.'),
      B('identity','6 Central Enterprises is the parent holding company. Every brand, app or service is a portfolio project, never the parent itself.'),
      B('mission','Mission: push the world forward through kindness and innovation.'),
      B('goals','Long-term objective: build 6C into a durable $1B+ holding company through ethical, highly leveraged business creation.'),
      B('priorities','Growth sequence: research → validate → build → measure → improve → document → automate → delegate → replicate → scale. Never scale an unproven process.'),
      B('values','No fake reviews, fake locations, misleading claims or dark patterns. Trust beats speed.'),
      B('style','Wants plain, direct answers that think two to three steps ahead, with risks and next actions.'),
      B('portfolio','Known projects include TJ’s Nationwide Roadside, TJ’s Roadside Operating System, Roadside Rush, The Credibility Machine, tire marketplaces and home-service lead-gen projects.'),
      B('constraints','A project is not a legal subsidiary unless the Commander confirms it.')
    ],
    comms:[{id:uid(),agentId:'a_ov',role:'system',text:'Station online. CENTRAL (your Overseer), SCOUT and QUILL are aboard. Talk to anyone here, or click the INBOX on the floor to send a job down the line SCOUT → QUILL. Rate finished work to earn XP.',t:Date.now()}],
    jobs:[],goals:[],files:{'README.txt':'Station workshop. Agents with the INTEL CAB read and write here.'},
    skills:[
      {id:'s1',name:'Kindness Standard',src:'6C ORIGINAL',needs:[],body:'In any customer-facing text: lead with empathy, state exactly what will happen and when, never over-promise, and offer one clear next step.'},
      {id:'s2',name:'Validate Before Scaling',src:'6C ORIGINAL',needs:[],body:'Before recommending spend: name the customer problem, the evidence of demand, the cheapest ethical test, the success threshold, and what would make you stop.'},
      {id:'s3',name:'Portfolio Fit Check',src:'6C ORIGINAL',needs:['core'],body:'Score an idea on mission fit, real demand, owned asset created, revenue path, leverage with other 6C projects, risks, and verdict: test now / later / not a fit / distraction.'},
      {id:'s4',name:'Partner Outreach Email',src:'6C ORIGINAL',needs:['cab'],body:'Short, specific, one observed strength, one concrete offer, no flattery, no fake urgency. Save drafts to outreach/<business>.txt.'},

function validate(){
  const st={};
  for(const it of S.items){
    const o=outs(it.id),n=ins(it.id);let s=null;
    if(it.type==='bay'){
      if(!it.agentId)s='NO AGENT — CLICK';
      else if(!hasPC(it))s='NO COMPUTE — ADD A PC';
      else if(!o.length&&!n.length)s=null;            // a staffed desk off the line is fine: chat works without belts
      else if(!n.length)s='NOT FED';
    }else if(it.type==='inbox'){if(!o.length)s='NOT CONNECTED'}
    else if(it.type==='splitter'){if(!n.length)s='NOT FED';else if(o.length<2)s='SPLITTER NEEDS 2 OUT-LANES'}
    else if(it.type==='joiner'){if(n.length<2)s='JOINER NEEDS 2 IN-LANES'}
    else if(it.type==='filter'){if(!n.length)s='NOT FED';else if(!o.some(b=>b.label==='ELSE'))s='NO DEFAULT LANE — CLICK'}
    else if(it.type==='merger'){if(!n.length)s='NOT FED'}
    else if(it.type==='loop'){if(!n.length)s='NOT FED';else if(!o.some(b=>b.label==='BACK')||!o.some(b=>b.label==='DONE'))s='LOOP HAS NO DONE / BACK LANE'}
    else if(it.type==='dish')s='DORMANT · NO WEB IN THIS BUILD';
    if(s)st[it.id]=s;
  }
  // cycles that don't pass through a LOOP tile
  const color={};const cyc=new Set();
  const dfs=(id,stack)=>{color[id]=1;stack.push(id);
    for(const b of outs(id)){const t=byId(b.to);if(!t||t.type==='loop')continue;
      if(color[t.id]===1){const k=stack.indexOf(t.id);stack.slice(k).forEach(x=>cyc.add(x))}
      else if(!color[t.id])dfs(t.id,stack)}
    stack.pop();color[id]=2};
  S.items.filter(i=>i.type!=='loop').forEach(i=>{if(!color[i.id])dfs(i.id,[])});
  cyc.forEach(id=>{const it=byId(id);st[id]=it.type==='bay'&&[...cyc].filter(x=>byId(x).type==='bay').length>=2?'WORK LINE LOOPS — CUT ONE HANDOFF':'LOOP! — BREAK THE CIRCLE'});
  return st;
}
function beltLit(b,st){
  const a=byId(b.from),c=byId(b.to);if(!a||!c)return false;
  const bad=x=>st[x.id]&&x.type!=='dish';
  return !bad(a)&&!bad(c);
}

  return undefined;
}

  if(tool===5){

    const b=beltAt(p.px,p.py);if(b){snapshot();S.belts=S.belts.filter(x=>x!==b);save();renderAll();hint('Belt cut.')}return}
  if(tool===6||tool===8){
    if(!RT.sub){hint('Pick a '+(tool===6?'gear piece':'signpost')+' in the bar below first.');return}

  if(tool===7){
    if(!it){RT.beltFrom=null;hint('Click a machine to start a belt.');return}
    if(!RT.beltFrom){if(isGear(it.type)){hint('Gear is not on the line. Belts connect inboxes, desks, signposts and outboxes.');return}RT.beltFrom=it.id;hint('Now click where the work goes next.');return}

    const from=RT.beltFrom;RT.beltFrom=null;
    if(S.belts.some(b=>b.from===from&&b.to===it.id)){hint('Those are already connected.');return}
    if(byId(from).type==='outbox'){hint('Outboxes are the end of a line.');return}

    save();renderAll();hint(bp.name+' placed. Click each desk to assign an agent.');return}
});

6 Central Enterprises is a parent holding company. Its mission: push the world forward through kindness and innovation. You serve the Commander.

${agent.interview.length?'What the Commander told you at recruitment:\n'+agent.interview.map(q=>`- ${q.q} → ${q.a}`).join('\n'):''}

${kept}

ACTIVE GOALS:
${goals}

YOUR MEMORY CORE:
${mem}

function toolset(agent,w,o){
  const T_=[];const A=S.autonomy;
  const blockedWrite=()=>o.unattended&&A.reach==='OBSERVE'?'Blocked: REACH is OBSERVE, so unattended runs cannot write.':null;
  const note=(txt)=>{w.trace.push(txt);if(RT.tab==='work')renderPanel()};
  T_.push({name:'ask_commander',description:'Ask the Commander ONE clarifying question with 2-4 concrete choices. Use before large or ambiguous work. Write tools wait until it is answered.',
    inputSchema:{type:'object',properties:{question:{type:'string'},choices:{type:'array',items:{type:'string'}}},required:['question','choices']},
    async execute({question,choices}){
      if(o.unattended)return 'The Commander is away. Pick the safest reasonable option and note the assumption under NEEDS YOU.';
      note('ask_commander: '+question);
      const m=pushMsg({agentId:agent.id,role:'ask',kind:'question',text:question,choices:(choices||[]).slice(0,4)});
      notifyTab('comms');speak(agent.name+' asks: '+question);
      const ans=await waitFor(m.id);return 'Commander chose: '+ans;}});
  if(gearOn('cab')){
    T_.push({name:'list_files',description:'List files in the station workshop.',inputSchema:{type:'object',properties:{}},
      async execute(){await walkTo(agent,'cab');note('list_files');return Object.keys(S.files).join('\n')||'(empty)'}});
    T_.push({name:'read_file',description:'Read a workshop file.',inputSchema:{type:'object',properties:{path:{type:'string'}},required:['path']},
      async execute({path}){await walkTo(agent,'cab');note('read_file '+path);if(!(path in S.files))throw new Error('No such file: '+path);return S.files[path].slice(0,20000)}});
    T_.push({name:'write_file',description:'Create or overwrite a workshop file (sandboxed, stays on the station).',inputSchema:{type:'object',properties:{path:{type:'string'},content:{type:'string'}},required:['path','content']},
      async execute({path,content}){const b=blockedWrite();if(b)return b;await walkTo(agent,'cab');path=String(path).replace(/^\/+/,'').slice(0,120);S.files[path]=String(content).slice(0,60000);note('write_file '+path);w.files.push(path);save();return 'Saved '+path}});
  }
  if(gearOn('core')){
    T_.push({name:'remember',description:'Save one durable note to your memory core.',inputSchema:{type:'object',properties:{note:{type:'string'}},required:['note']},
      async execute({note:n}){const b=blockedWrite();if(b)return b;await walkTo(agent,'core');agent.memory.push({text:String(n).slice(0,400),t:Date.now(),uses:0});note('remember');save();return 'Remembered.'}});
    T_.push({name:'recall',description:'Search your memory core.',inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
      async execute({query}){await walkTo(agent,'core');note('recall '+query);const q=String(query).toLowerCase().split(/\W+/).filter(Boolean);
        const hits=agent.memory.filter(m=>q.some(w=>m.text.toLowerCase().includes(w)));hits.forEach(m=>m.uses=(m.uses||0)+1);return hits.map(m=>m.text).join('\n')||'Nothing matching.'}});
  }
  if(gearOn('bench')){
    T_.push({name:'run_js',description:'Run JavaScript in a sandboxed worker (no network, 4s limit). Use console.log for output. Needs the Commander’s approval.',inputSchema:{type:'object',properties:{code:{type:'string'},why:{type:'string'}},required:['code']},
      async execute({code,why}){
        if(o.unattended){logAway('declined','run_js needs approval; '+agent.name+' was unattended');return 'Declined: running code needs the Commander, who is away.'}
        const m=pushMsg({agentId:agent.id,role:'ask',kind:'approval',text:(why||'Run code at the workbench')+'',code:String(code).slice(0,4000)});notifyTab('comms');
        const ok=await waitFor(m.id);if(ok!=='approve')return 'The Commander denied running this code.';
        await walkTo(agent,'bench');note('run_js');return await runWorker(code);}});
  }
  if(gearOn('studio')){
    T_.push({name:'make_image',description:'Save an SVG image (full <svg> markup) to the workshop and show it to the Commander.',inputSchema:{type:'object',properties:{name:{type:'string'},svg:{type:'string'}},required:['name','svg']},
      async execute({name,svg}){const b=blockedWrite();if(b)return b;await walkTo(agent,'studio');svg=String(svg);if(!/^\s*<svg[\s>]/i.test(svg))return 'Not SVG markup.';
        const path='images/'+String(name).replace(/[^\w.-]/g,'_').slice(0,60)+'.svg';S.files[path]=svg.slice(0,60000);note('make_image '+path);w.files.push(path);
        pushMsg({agentId:agent.id,role:'agent',kind:'image',text:path,svg:S.files[path]});save();return 'Saved '+path}});
  }
  if((CLASSES[agent.cls]||{}).delegate&&!agent.temp&&(o.depth||0)<1){
    T_.push({name:'dispatch',description:'Assign a subtask to a crew member by name. Returns their result.',inputSchema:{type:'object',properties:{agent:{type:'string'},task:{type:'string'}},required:['agent','task']},
      async execute({agent:nm,task}){const t=S.agents.find(a=>a.name.toLowerCase()===String(nm).toLowerCase());if(!t)return 'No crew member named '+nm+'. Crew: '+S.agents.map(a=>a.name).join(', ');
        if(t.id===agent.id)return 'Do it yourself.';note('dispatch → '+t.name);const r=await runAgent(t,task,{kind:'dispatch',parent:w.id,job:o.job,depth:1,unattended:o.unattended});return r.slice(0,6000)}});
    T_.push({name:'spawn',description:'Create a temporary clone of yourself to work a subtask in parallel. It is discarded afterwards.',inputSchema:{type:'object',properties:{task:{type:'string'}},required:['task']},

        RT.temps.push(clone);const h=pos(agent);RT.pos[clone.id]={x:h.x+10,y:h.y,tx:h.x+30,ty:h.y+8,walk:0};note('spawn '+clone.name);
        try{return (await runAgent(clone,task,{kind:'spawn',parent:w.id,job:o.job,depth:1,unattended:o.unattended})).slice(0,6000)}
        finally{setTimeout(()=>{RT.temps=RT.temps.filter(x=>x!==clone);delete RT.pos[clone.id]},1500)}}});
    T_.push({name:'summon',description:'Recruit a NEW specialist onto the crew (needs the Commander’s approval). Classes: '+Object.keys(CLASSES).filter(k=>k!=='overseer').join(', '),inputSchema:{type:'object',properties:{cls:{type:'string'},name:{type:'string'},why:{type:'string'}},required:['cls','name','why']},
      async execute({cls,name,why}){if(o.unattended)return 'Recruiting needs the Commander, who is away. Listed under NEEDS YOU.';
        cls=CLASSES[cls]?cls:'custom';const m=pushMsg({agentId:agent.id,role:'ask',kind:'approval',text:`Recruit ${String(name).toUpperCase()} (${CLASSES[cls].label}): ${why}`});notifyTab('comms');
        if(await waitFor(m.id)!=='approve')return 'The Commander declined.';
        const a=makeAgent({name,cls,personality:'Focused',interview:[{q:'Summoned by '+agent.name+' because',a:why}]});note('summon '+a.name);return a.name+' joined the crew. Use dispatch to give them work.'}});
  }
  return T_;
}
function runWorker(code){
  return new Promise(res=>{
    const src=`const out=[];const fmt=v=>typeof v==='string'?v:JSON.stringify(v);console.log=(...a)=>out.push(a.map(fmt).join(' '));self.fetch=undefined;self.XMLHttpRequest=undefined;self.WebSocket=undefined;self.importScripts=undefined;
onmessage=async e=>{try{const r=await (new Function('return (async()=>{'+e.data+'\\n})()'))();if(r!==undefined)out.push('=> '+fmt(r));postMessage(out.join('\\n')||'(no output)')}catch(err){postMessage(out.join('\\n')+'\\nError: '+err.message)}}`;
    let wk;try{wk=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})))}catch(e){res('Workbench unavailable: '+e.message);return}
    const to=setTimeout(()=>{wk.terminate();res('Stopped: ran longer than 4 seconds.')},4000);
    wk.onmessage=e=>{clearTimeout(to);wk.terminate();res(String(e.data).slice(0,8000))};
    wk.postMessage(code);
  });
}
async function runAgent(agent,task,o={}){
  if(!RT.sample)throw Object.assign(new Error('Claude link is offline'),{code:'not_granted'});
  const w={id:uid(),agentId:agent.id,agentName:agent.name,kind:o.kind||'chat',prompt:task,o,status:'running',text:'',trace:[],files:[],ctl:new AbortController(),started:Date.now(),jobId:o.job?.id,parent:o.parent||null};
  RT.workers.set(w.id,w);agent.live=(agent.live||0)+1;renderHUD();if(RT.tab==='work')renderPanel();
  const msg=pushMsg({agentId:agent.id,role:'agent',text:'',live:true,worker:w.id,label:o.kind!=='chat'?o.kind.toUpperCase()+(o.job?' · '+o.job.title.slice(0,40):''):''});
  const t0=Date.now();
  try{
    const r=await RT.sample(brief(agent,o)+'\n\nTASK:\n'+task,{modelTier:agent.tier,tools:toolset(agent,w,o),signal:w.ctl.signal,cache:false,onText:({text})=>{w.text=text;liveUpdate(msg.id,text)}});
    w.status='done';w.text=r.text;msg.text=r.text+(r.truncated?'\n\n[cut short]':'');msg.live=false;
    if(!agent.temp){agent.runs++;agent.clean++}
    S.runlog.push({t:Date.now(),agent:agent.name,tier:agent.tier,ms:Date.now()-t0,chars:r.text.length,ok:true,kind:w.kind,unattended:!!o.unattended});
    speak(r.text);
    return r.text;
  }catch(e){
    w.status=e.code==='cancelled'||e.name==='AbortError'?'interrupted':'failed';w.error=e.message||e.code;
    msg.text=(w.text?w.text+'\n\n':'')+(w.status==='interrupted'?'[interrupted by the Commander]':'[run failed: '+(e.code||'')+' '+(e.message||'')+']');msg.live=false;
    if(!agent.temp)agent.runs++;
    S.runlog.push({t:Date.now(),agent:agent.name,tier:agent.tier,ms:Date.now()-t0,chars:(w.text||'').length,ok:false,kind:w.kind,unattended:!!o.unattended});
    throw e;
  }finally{
    agent.live=Math.max(0,(agent.live||1)-1);goHome(agent);save();renderHUD();renderPanel();
  }
}

function newJob(title,input,extra={}){const j={id:'j_'+uid(),title:title.slice(0,80),input,status:'running',hops:0,created:Date.now(),contributors:[],output:'',notes:[],rating:null,...extra};S.jobs.push(j);save();return j}
function finishJob(j,output,notes=[]){
  j.output=output;j.notes.push(...notes);j.status=output?'delivered':'stopped';j.done=Date.now();
  if(j.unattended){S.drafts.push({id:uid(),jobId:j.id,title:j.title,t:Date.now(),reviewed:false});logAway('fired','Draft ready: '+j.title)}
  else if(output)pushMsg({agentId:j.contributors[0]||'a_ov',role:'system',kind:'rate',jobId:j.id,text:'Delivered: '+j.title});
  if(j.questStep){const [gid,si]=j.questStep;const goal=S.goals.find(x=>x.id===gid);if(goal){const s=goal.steps[si];
    if(output){s.status='done';s.evidence=output.slice(0,600)}else s.status='todo';s.jobId=null}}
  save();renderAll();
}
async function sendDirect(agent,text,extra={}){
  const j=newJob(text,text,{agentId:agent.id,...extra});j.contributors=[agent.id];
  try{const out=await runAgent(agent,text,{kind:extra.unattended?'away':'chat',job:j,unattended:extra.unattended});finishJob(j,out)}
  catch(e){finishJob(j,'',['Stopped: '+(e.code||e.message)])}
  return j;
}
function classify(text){
  if(/\b(code|bug|function|script|api|javascript|python|html|css|sql|deploy|app|regex|spreadsheet formula)\b/i.test(text))return 'CODE';
  if(/\b(research|find|compare|competitor|market|analy[sz]e|study|sources?|who are|what is|demand|trends?)\b/i.test(text))return 'RESEARCH';
  return 'ELSE';
}
function lineReady(inbox){
  const st=RT.lastSt||validate();const seen=new Set();const q=[inbox.id];let outbox=false;const bad=[];
  while(q.length){const id=q.shift();if(seen.has(id))continue;seen.add(id);const it=byId(id);if(st[id]&&it.type!=='dish')bad.push(it);if(it.type==='outbox')outbox=true;outs(id).forEach(b=>q.push(b.to))}
  return {ok:outbox&&!bad.length,outbox,bad};
}
async function runLine(inbox,text,extra={}){
  const chk=lineReady(inbox);
  if(!chk.ok){toast(chk.bad.length?'Line blocked: '+(RT.lastSt[chk.bad[0].id]):'This line never reaches an OUTBOX.','bad');return}
  const j=newJob(text,text,{line:inbox.id,...extra});
  const ctx={passes:{},joins:{},rr:{},outputs:[],stopped:false};
  pushMsg({agentId:'a_ov',role:'system',text:'Job on the line: '+j.title});
  await flow(j,inbox,{text},ctx);
  const out=ctx.outputs.join('\n\n---\n\n');
  finishJob(j,out,ctx.stopped?['Stopped at the hop cap ('+(inbox.hopCap||6)+'). Finished work kept.']:[]);
}
async function travel(j,b,payload,ctx){
  const a=byId(b.from),c=byId(b.to);if(!a||!c)return;
  const dur=reduced?0:Math.max(500,Math.hypot(c.x-a.x,c.y-a.y)*140);
  RT.boxes.push({belt:b.id,ax:a.x*T+16,ay:a.y*T+16,bx:c.x*T+16,by:c.y*T+16,t0:performance.now(),dur});
  await sleep(dur);return flow(j,c,payload,ctx);
}
async function flow(j,node,payload,ctx){
  if(j.halted||ctx.stopped)return;
  const o=outs(node.id);
  const fan=list=>Promise.all(list.map(b=>travel(j,b,payload,ctx)));
  switch(node.type){
    case 'inbox':case 'merger':return fan(o);
    case 'outbox':ctx.outputs.push(payload.text);return;
    case 'filter':{const lane=classify(payload.text);const b=o.find(x=>x.label===lane)||o.find(x=>x.label==='ELSE');j.notes.push('Filter sent it down '+(b?.label||'?'));return b&&travel(j,b,payload,ctx)}
    case 'splitter':{
      const joinerAhead=(()=>{const seen=new Set(),q=o.map(b=>b.to);while(q.length){const id=q.shift();if(seen.has(id))continue;seen.add(id);const it=byId(id);if(it?.type==='joiner')return true;outs(id).forEach(b=>q.push(b.to))}return false})();
      if(joinerAhead)return fan(o);
      const k=(ctx.rr[node.id]=(ctx.rr[node.id]||0)+1)-1;return travel(j,o[k%o.length],payload,ctx);}
    case 'joiner':{const arr=ctx.joins[node.id]=ctx.joins[node.id]||[];arr.push(payload.text);if(arr.length<ins(node.id).length)return;
      return travelAll(j,o,{text:arr.map((t,i)=>`### Branch ${i+1}\n${t}`).join('\n\n')},ctx)}
    case 'loop':{const p=ctx.passes[node.id]=(ctx.passes[node.id]||0)+1;const ok=/^\s*\**APPROVED/i.test(payload.text);
      const lane=ok||p>=(node.max||3)?'DONE':'BACK';const b=o.find(x=>x.label===lane);j.notes.push(`Loop pass ${p}: ${lane}`);
      const next=lane==='DONE'?{text:payload.text.replace(/^\s*\**APPROVED\**[:.\s-]*/i,'')}:payload;return b&&travel(j,b,next,ctx)}
    case 'bay':{
      const cap=byId(j.line)?.hopCap||6;if(j.hops>=cap){ctx.stopped=true;ctx.outputs.push(payload.text);return}
      const agent=agentById(node.agentId);if(!agent){ctx.stopped=true;return}
      j.hops++;if(!j.contributors.includes(agent.id))j.contributors.push(agent.id);
      const toLoop=o.some(b=>byId(b.to)?.type==='loop');
      const task=`You are one desk on a conveyor line. Do YOUR part of the job and pass it on.
ORIGINAL JOB FROM THE COMMANDER:
${j.input}

${payload.text===j.input?'You are the first desk.':'WORK HANDED TO YOU BY THE PREVIOUS DESK:\n'+payload.text}
${toLoop?'\nYour output feeds a LOOP gate. If the work is ready to ship, begin your reply with the word APPROVED and then give the final version in full. Otherwise list specific fixes and include the current draft.':''}
${o.length?'':'You are the last desk: return the finished deliverable.'}`;
      RT.atBay[node.id]=j.id;
      let text;
      try{text=await runAgent(agent,task,{kind:'line',job:j,unattended:j.unattended})}
      catch(e){ctx.stopped=true;ctx.outputs.push(payload.text===j.input?'':payload.text);j.notes.push(agent.name+' stopped: '+(e.code||e.message));return}
      finally{delete RT.atBay[node.id]}
      if(!o.length){ctx.outputs.push(text);return}
      return fan2(j,o,{text},ctx);
    }
  }
}
function fan2(j,o,payload,ctx){return Promise.all(o.map(b=>travel(j,b,payload,ctx)))}
function travelAll(j,o,payload,ctx){return fan2(j,o,payload,ctx)}

function meters(a){
  const r=a.ratings.slice(-8);const conf=r.length?r.reduce((s,v)=>s+(v===1?1:v===0?.5:0),0)/r.length:.5;
  return {conf,rel:a.runs?a.clean/a.runs:0,prac:Math.min(1,a.runs/40)};
}
function memTrust(m){const age=(Date.now()-m.t)/864e5;return clamp((0.4+0.15*(m.uses||0))*Math.exp(-age/45),0,1)}

TASK: ${j.input.slice(0,1500)}
DELIVERABLE (start): ${j.output.slice(0,2500)}
Existing beliefs: ${S.beliefs.filter(b=>b.status!=='struck').map(b=>b.text).join(' | ').slice(0,3000)}
Beliefs the Commander struck (never propose these again): ${struck.join(' | ').slice(0,1500)||'none'}
Propose at most ONE new, specific belief about the Commander's preferences that this rating supports (for example "Prefers a working demo over a written spec"). If nothing new is supported, return null.
Reply with only JSON: {"dim": one of ${JSON.stringify(DIMS)}, "text": "..."} or null`,{modelTier:'quick'});
      if(res&&res.text&&!S.beliefs.some(b=>b.text.toLowerCase()===String(res.text).toLowerCase())){
        const b={id:'k_'+uid(),dim:DIMS.includes(res.dim)?res.dim:'style',text:String(res.text).slice(0,240),source:'Proposed after you rated "'+j.title.slice(0,40)+'"',status:'proposed',t:Date.now()};

    }catch(e){/* proposal is optional */}
  }
}

async function draftQuest(text){
  if(!RT.sample){toast('Claude link is offline.','bad');return}
  const goal={id:'g_'+uid(),text,steps:[],status:'drafting',created:Date.now()};S.goals.push(goal);
  S.beliefs.push({id:'k_'+uid(),dim:'goals',text:'Goal: '+text,source:'You set this goal',status:'kept',t:Date.now(),goalId:goal.id});
  renderAll();
  try{
    const steps=await RT.sample.json(`Break this goal for 6 Central Enterprises into 3 to 5 concrete milestones that an AI crew can actually complete as desk work (research, drafts, plans, scripts, analyses, SOPs). Each milestone must produce a deliverable. Follow research → validate → build. Goal: "${text}"
Commander context: ${S.beliefs.filter(b=>b.status==='kept').map(b=>b.text).join(' ').slice(0,2000)}
Reply with only a JSON array of strings, each under 110 characters.`,{modelTier:'default'});
    goal.steps=(Array.isArray(steps)?steps:[]).slice(0,5).map(s=>({text:String(s).slice(0,160),status:'todo'}));
    goal.status=goal.steps.length?'offered':'failed';
    if(goal.steps.length)pushMsg({agentId:'a_ov',role:'system',kind:'tree',goalId:goal.id,text:'CENTRAL drafted a quest tree for: '+text});
  }catch(e){goal.status='failed';toast('Could not draft the tree: '+(e.code||e.message),'bad')}
  save();renderAll();
}
function acceptStep(gid,si){
  const goal=S.goals.find(x=>x.id===gid);const s=goal?.steps[si];if(!s||s.status!=='todo')return;
  const ov=S.agents.find(a=>a.overseer);s.status='running';save();renderAll();
  sendDirect(ov,`QUEST STEP for the goal "${goal.text}":\n${s.text}\n\nDo this step now. Dispatch to crew where a specialist fits better. Deliver the finished result.`,{questStep:[gid,si]});
}

function logDecision(kind,gate,text){S.decisions.push({t:Date.now(),kind,gate,text})}
function logAway(kind,text){S.awayLog.push({t:Date.now(),kind,text});save()}
function isAway(){return RT.forcedAway||Date.now()-RT.lastInput>=AWAY_MS}
function rollDay(){const A=S.autonomy;if(A.day!==today()){A.day=today();A.todayCount=0}}
function nextStep(){
  const A=S.autonomy;
  for(const goal of S.goals.filter(x=>!x.retired&&x.status==='confirmed')){
    if(A.ruleOut.some(r=>goal.text.toLowerCase().includes(r.toLowerCase())))continue;
    if(A.focus&&!goal.text.toLowerCase().includes(A.focus.toLowerCase()))continue;
    const i=goal.steps.findIndex(s=>s.status==='todo');if(i>=0)return [goal,i];
  }
  return null;
}
async function beat(){
  const A=S.autonomy;rollDay();const n=Date.now();
  const gates=[['posture',A.initiative!=='WAIT'],['away',isAway()],['leash',A.todayCount<PACE[A.pace]],['cooldown',n-(A.lastBeat||0)>=COOLDOWN_MS],['halt',!A.halted],['concurrency',liveCount()===0],['link',!!RT.sample]];
  const fail=gates.find(x=>!x[1]);
  if(fail){if(RT.lastGateFail!==fail[0]&&fail[0]!=='away'&&fail[0]!=='posture'){logDecision('skip',fail[0],'Beat skipped at '+fail[0].toUpperCase()+' gate');if(isAway())logAway('skipped',fail[0].toUpperCase())}RT.lastGateFail=fail[0];return}
  RT.lastGateFail=null;A.lastBeat=n;A.todayCount++;
  const ov=S.agents.find(a=>a.overseer);const ns=nextStep();
  if(A.initiative==='SUGGEST'){
    logDecision('fire','all','Drafting a suggestion');
    const j=newJob('Suggestion: next best move','',{unattended:true,agentId:ov.id});j.contributors=[ov.id];
    try{const out=await runAgent(ov,`Suggest the single next best job for the crew${A.focus?' (focus: '+A.focus+')':''}. ${ns?'Open quest step: '+ns[0].steps[ns[1]].text:''} Give: the job, why now, expected deliverable, and the risk. Do not do the work.`,{kind:'away',job:j,unattended:true});finishJob(j,out)}catch(e){finishJob(j,'',['Failed'])}
  }else if(ns){
    const [goal,i]=ns;logDecision('fire','all','Working quest step: '+goal.steps[i].text);goal.steps[i].status='running';
    await sendDirect(ov,`UNATTENDED QUEST STEP for the goal "${goal.text}":\n${goal.steps[i].text}\nProduce a draft deliverable for review.`,{unattended:true,questStep:[goal.id,i]});
  }else if(A.initiative==='FREE'){
    logDecision('fire','all','Free pick toward goals');
    await sendDirect(ov,`You have free initiative while the Commander is away${A.focus?' (focus: '+A.focus+')':''}. Off-limits: ${A.ruleOut.join(', ')||'none'}. Pick ONE small, grounded piece of desk work that advances 6C's goals and produce a draft.`,{unattended:true});
  }else{logDecision('defer','work','BUILD found no open quest step');A.todayCount--}
  A.lastJob=Date.now();save();renderAll();
}
function tickRoutines(){
  if(!S.autonomy.scheduling||!RT.sample)return;
  const now=new Date();
  for(const r of S.routines.filter(x=>x.enabled)){
    let due=false;
    if(r.mode==='daily'){const [h,m]=(r.at||'09:00').split(':').map(Number);const at=new Date();at.setHours(h,m,0,0);due=now>=at&&(r.lastRun||0)<at.getTime()}
    else due=Date.now()-(r.lastRun||0)>=(r.hours||24)*3600e3;
    if(!due)continue;
    r.lastRun=Date.now();const ag=agentById(r.agentId)||S.agents[0];const rec=S.recipes.find(x=>x.id===r.recipeId);
    logDecision('fire','routine','Routine: '+r.name);
    sendDirect(ag,rec?rec.prompt:r.name,{unattended:isAway(),routine:r.id});
  }
}
function checkReturn(){
  if(RT.wasAway&&!RT.forcedAway&&S.awayLog.length){
    RT.wasAway=false;S.lastReport={t:Date.now(),items:S.awayLog.slice()};S.awayLog=[];save();openReport(S.lastReport);
  }
}

  }else if(it.type==='loop'){

  }else if(it.type==='filter'){
    h+=`<div class="small muted">${SIGNS.filter.desc} If a job reads as both code and research, CODE wins. It never drops work. Click a lane label on the floor to change which category it carries.</div>`;

  h+=`<div class="row"><button class="btn" data-act="closeModal">CLOSE</button></div>`;
  openModal(h);
}

function sendFromComposer(){
  const box=$('#say');if(!box)return;const text=box.value.trim();if(!text)return;box.value='';
  const a=agentById(RT.talkTo);
  if(text.startsWith('/')){
    const [cmd,...rest]=text.slice(1).split(' ');const arg=rest.join(' ').trim();
    if(cmd==='help'){pushMsg({agentId:a.id,role:'system',text:'/goal <outcome> set a goal · /recruit open the Recruitment Bay · /line <job> send down the first ready line · /remember <note> add to this agent\'s memory · /stop interrupt this agent · /away step away now'});return}
    if(cmd==='goal'&&arg){draftQuest(arg);RT.tab='quests';renderAll();return}
    if(cmd==='recruit'){RT.recruit=null;openRecruit(1);return}
    if(cmd==='remember'&&arg){a.memory.push({text:arg,t:Date.now(),uses:0});save();toast('Saved to '+a.name+'’s memory core.');return}
    if(cmd==='stop'){stopAgent(a);return}
    if(cmd==='away'){RT.forcedAway=true;RT.wasAway=true;toast('Marked away.');return}
    if(cmd==='line'&&arg){const ib=S.items.find(i=>i.type==='inbox'&&lineReady(i).ok);if(!ib){toast('No ready line. Open REFIT to build one.','bad');return}runLine(ib,arg);return}
    pushMsg({agentId:a.id,role:'system',text:'Unknown command. Try /help.'});return;
  }
  pushMsg({agentId:a.id,role:'you',text});
  sendDirect(a,text);
}
function stopAgent(a){[...RT.workers.values()].filter(w=>w.agentId===a.id&&w.status==='running').forEach(w=>w.ctl.abort());S.jobs.filter(j=>j.status==='running'&&j.contributors.includes(a.id)).forEach(j=>j.halted=true)}
document.addEventListener('keydown',e=>{if(e.target.id==='say'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendFromComposer()}});
document.addEventListener('change',e=>{
  const t=e.target;const a=agentById(t.dataset?.id);
  if(t.dataset.act==='tier'&&a){a.tier=t.value;save();toast(a.name+' now runs on '+TIERS[a.tier]+'.')}
  if(t.dataset.act==='skin'&&a){a.skin=+t.value;save()}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const act=b.dataset.act,id=b.dataset.id;const A=S.autonomy;
  switch(act){

    case 'stop':stopAgent(agentById(RT.talkTo));break;
    case 'listen':listen();break;
    case 'prefill':{const r=S.recipes.find(x=>x.id===id);RT.tab='comms';renderAll();const s=$('#say');if(s){s.value=r.prompt;s.focus();const m=r.prompt.indexOf('{{');if(m>=0)s.setSelectionRange(m,r.prompt.indexOf('}}',m)+2)}break}

    case 'answerText':{const v=$('#ans_'+id)?.value.trim();if(!v)break;const m=findMsg(id);m.answer=v;settle(id,v);save();renderPanel();break}
    case 'approve':case 'deny':{const m=findMsg(id);m.decided=act;settle(id,act);save();renderPanel();break}
    case 'rate':rate(id,+b.dataset.v);break;
    case 'keep':{const x=S.beliefs.find(q=>q.id===id);x.status='kept';save();renderPanel();break}
    case 'strike':{const x=S.beliefs.find(q=>q.id===id);x.status='struck';save();renderPanel();break}
    case 'editBelief':{const x=S.beliefs.find(q=>q.id===id);openModal(`<h2>EDIT BELIEF</h2><label class="f">DIMENSION<select id="bDim">${DIMS.map(d=>`<option ${x.dim===d?'selected':''}>${d}</option>`).join('')}</select></label><label class="f">BELIEF<textarea id="bText">${esc(x.text)}</textarea></label><div class="row"><button class="btn pri" data-act="saveBelief" data-id="${x.id}">SAVE</button><button class="btn" data-act="closeModal">CANCEL</button></div>`);break}
    case 'addBelief':openModal(`<h2>ADD BELIEF</h2><label class="f">DIMENSION<select id="bDim">${DIMS.map(d=>`<option>${d}</option>`).join('')}</select></label><label class="f">BELIEF<textarea id="bText"></textarea></label><div class="row"><button class="btn pri" data-act="saveBelief">SAVE</button><button class="btn" data-act="closeModal">CANCEL</button></div>`);break;
    case 'saveBelief':{const txt=$('#bText').value.trim();if(!txt)break;let x=S.beliefs.find(q=>q.id===id);
      if(x){x.text=txt;x.dim=$('#bDim').value;x.source='Edited by you';const gl=x.goalId&&S.goals.find(g=>g.id===x.goalId);if(gl&&!gl.retired){gl.retired=true;closeModal();draftQuest(txt.replace(/^Goal:\s*/,''));save();renderAll();break}}
      else S.beliefs.push({id:'k_'+uid(),dim:$('#bDim').value,text:txt,source:'Added by you',status:'kept',t:Date.now()});
      closeModal();save();renderPanel();break}
    case 'interview':openInterview();break;
    case 'interviewGo':{document.querySelectorAll('[id^=iv]').forEach(t=>{const v=t.value.trim();if(v)S.beliefs.push({id:'k_'+uid(),dim:t.dataset.dim,text:v,source:'Your interview',status:'kept',t:Date.now()})});closeModal();save();renderPanel();toast('Dossier updated.');break}
    case 'recruit':RT.recruit=null;openRecruit(1);break;
    case 'pickClass':RT.recruit.cls=id;openRecruit(2);break;
    case 'recruitBack':openRecruit(1);break;
    case 'respec':{const a=agentById(id);RT.recruit={cls:a.cls==='overseer'?'overseer':a.cls,respec:id};if(a.overseer){openRecruit(2)}else openRecruit(1);break}
    case 'recruitGo':{const r=RT.recruit;const name=$('#rName').value.trim()||'NEW';const iv=[];const q1=$('#rQ1').value.trim(),q2=$('#rQ2').value.trim();
      if(q1)iv.push({q:'Your goals',a:q1});if(q2)iv.push({q:'Great work looks like',a:q2});
      if(r.respec){const a=agentById(r.respec);a.cls=r.cls;a.name=name.toUpperCase().slice(0,12);a.personality=$('#rPers').value.trim();a.tier=$('#rTier').value;a.customClass=$('#rCustom')?.value.trim()||'';a.interview.push(...iv);save();toast(a.name+' re-specced.')}
      else makeAgent({name,cls:r.cls,personality:$('#rPers').value.trim(),interview:iv,tier:$('#rTier').value,customClass:$('#rCustom')?.value.trim()});
      closeModal();renderAll();break}
    case 'dismiss':{const a=agentById(id);if(a.overseer)break;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='CONFIRM DISMISS';break}
      S.items.forEach(i=>{if(i.agentId===id)i.agentId=null});S.agents=S.agents.filter(x=>x.id!==id);if(RT.talkTo===id)RT.talkTo=S.agents[0].id;save();renderAll();break}
    case 'assign':{const it=byId(id);const v=$('#bayAgent').value||null;if(v&&S.items.some(i=>i.type==='bay'&&i.id!==id&&i.agentId===v)){toast('That agent already staffs a desk.','bad');break}snapshot();it.agentId=v;rehome();save();closeModal();renderAll();break}
    case 'sendLine':{const it=byId(id);const n=+$('#hopCap').value;if(n)it.hopCap=clamp(n,1,20);const txt=$('#inboxText').value.trim();if(!txt)break;closeModal();runLine(it,txt);break}
    case 'setLoop':{const it=byId(id);it.max=clamp(+$('#loopMax').value||3,1,5);save();closeModal();break}
    case 'closeModal':closeModal();break;
    case 'setGoal':{const t=$('#goalText').value.trim();if(t)draftQuest(t);break}
    case 'confirmTree':{const gl=S.goals.find(x=>x.id===id);if(gl.status==='offered'){S.goals.filter(x=>x.status==='offered'&&x!==gl).forEach(x=>x.status='declined');gl.status='confirmed'}save();renderAll();break}
    case 'declineTree':{const gl=S.goals.find(x=>x.id===id);gl.status='declined';gl.retired=true;save();renderAll();break}
    case 'accept':acceptStep(b.dataset.g,+b.dataset.i);break;
    case 'retire':{const gl=S.goals.find(x=>x.id===id);gl.retired=true;S.beliefs.filter(x=>x.goalId===id).forEach(x=>x.status='struck');save();renderAll();break}
    case 'sendJob':{const t=$('#jobText').value.trim();if(!t)break;const [k,v]=$('#jobRoute').value.split(':');if(k==='line')runLine(byId(v),t);else{pushMsg({agentId:v,role:'you',text:t});sendDirect(agentById(v),t)}$('#jobText').value='';break}
    case 'interrupt':{const w=RT.workers.get(id);w?.ctl.abort();if(w?.jobId){const j=S.jobs.find(x=>x.id===w.jobId);if(j)j.halted=true}break}
    case 'resume':{const w=RT.workers.get(id);const a=agentById(w.agentId);if(!a){toast('That worker was a temporary clone and is gone.','bad');break}
      const j=w.jobId&&S.jobs.find(x=>x.id===w.jobId);if(j){j.halted=false;j.status='running'}
      runAgent(a,w.prompt+(w.text?'\n\n(You were interrupted. Your partial work so far:)\n'+w.text.slice(0,3000)+'\nContinue from there.':''),{...w.o,kind:w.kind}).then(out=>{if(j)finishJob(j,out)}).catch(()=>{if(j)finishJob(j,'',['Resume stopped'])});break}

    case 'dropRoutine':S.routines=S.routines.filter(x=>x.id!==id);save();renderPanel();break;
    case 'seg':{A[b.dataset.k]=b.dataset.v;logDecision('setting',b.dataset.k,b.dataset.k.toUpperCase()+' set to '+b.dataset.v+' by you');save();renderAll();break}

    case 'halt':A.halted=!A.halted;if(A.halted)[...RT.workers.values()].filter(w=>w.o?.unattended&&w.status==='running').forEach(w=>w.ctl.abort());logDecision('setting','halt',A.halted?'Halted by you':'Automation resumed by you');save();renderAll();break;
    case 'sched':A.scheduling=!A.scheduling;logDecision('setting','scheduling','Scheduling '+(A.scheduling?'on':'off'));save();renderAll();break;

    case 'copyFile':{const t=S.files[id];try{await navigator.clipboard.writeText(t);toast('Copied.')}catch(err){toast('Copy blocked here. Open the file and select the text.','bad')}break}
    case 'dropFile':delete S.files[id];save();renderPanel();break;
    case 'resetAsk':$('#resetConfirm').innerHTML='<button class="btn sm danger" data-act="resetGo">YES, ERASE EVERYTHING</button>';break;
    case 'resetGo':S=seed();RT.pos={};save();flush();renderAll();toast('Station reset.');break;
  }
});

(async()=>{
  const C=window.claude;
  if(!C||!C.use){RT.linkChecked=true;renderAll();return}

  if(db&&user){
    try{const id=await user.id();if(id){RT.docRef=db.doc('data/users/'+id+'/deck');

      else flush();}}catch(e){console.warn('db',e)}
  }
  S.jobs.filter(j=>j.status==='running').forEach(j=>{j.status='stopped';j.notes.push('The deck was closed mid-run.')});
  S.goals.forEach(g=>g.steps.forEach(s=>{if(s.status==='running')s.status='todo'}));
  renderAll();
})();
setTimeout(()=>{if(!RT.linkChecked){RT.linkChecked=true;renderAll()}},11000);
</script>
